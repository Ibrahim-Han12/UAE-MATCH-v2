# =============================================================
# 小缘输出校验规则（语气闸）
# 版本: v1.1 | 权威依据: persona_xiaoyuan v1.1 交付物 4（DEC-018）
# 性质: 活资产 —— 与问法库同性质，产品负责人可自行增删，改动无需改代码
# 用途: 生成后的纯代码校验（零模型成本）。hard 命中即重生成；review 命中仅埋点。
# 铁律: 危机固定话术不走生成，因此**不经本校验器**（PRD 9.2）。
# =============================================================

meta:
  version: 1.1
  authority: "persona_xiaoyuan v1.1 交付物 4"
  regenerate_max: 1          # hard 命中后最多重生成几次（成本纪律：默认 1 次）
  max_chars: 120             # 单条回复字数软上限（review）
  max_sentences: 4           # 单条回复句数软上限（review）

# 完全绕过校验的场景：内容不走生成，既不该被检测，更不该被重生成。
bypass_scenes:
  - crisis        # 危机固定话术（PRD 9.2 铁律）

# 场景豁免：某些场景下编排器**要求**出现被禁的表达，此处按组豁免。
# scene 由调用方传入；未列出的场景不豁免任何组。
scene_exemptions:
  # 进度答复：编排器要求如实报完成度百分比与缺口话题清单（会超长）
  progress: [progress_language, length]
  # 收尾：正反馈句允许略长
  wrapup: [length, missing_question, closing_phrases]

groups:
  - id: honorific
    type: hard
    mode: substring
    patterns: ["您"]
    reason: 单字符匹配，客服腔复发的最强信号；人格层明令只用"你"

  - id: ai_disclaimer
    type: hard
    mode: substring
    patterns: ["作为AI", "作为 AI", "作为您的", "作为一个AI", "作为一个 AI",
               "没有真实的情感", "没有真实情感", "我只是一个"]
    reason: 自我指涉式免责与贬抑式免责；身份透明的正确写法见 Voice Guide #9

  - id: declared_empathy
    type: hard
    mode: substring
    patterns: ["我理解您", "我理解你的感受", "我能理解你的感受"]
    reason: 宣布式共情；正确做法是复述对方没说出口的那半句

  - id: service_desk
    type: hard
    mode: substring
    patterns: ["请问", "亲爱的", "非常抱歉", "给您带来", "感谢您的配合"]
    reason: 客服问询与道歉模板

  - id: system_voice
    type: hard
    mode: substring
    patterns: ["已记录", "根据系统", "根据我的记录", "系统显示", "检测到",
               "我记下来了", "我记下了", "已为你记录", "帮你记下了"]
    reason: 暴露系统内部视角，破坏"像人一样记得"

  - id: report_tone
    type: hard
    mode: substring
    patterns: ["首先", "其次", "综上", "总的来说"]
    reason: 公文／报告腔；聊天不分点

  - id: form_tone
    type: hard
    mode: substring
    patterns: ["该字段", "必填", "请您补充", "请确认", "填写完整"]
    reason: 表单腔，地板字段场景高发

  - id: elasticity_checklist
    type: hard
    mode: substring
    patterns: ["是否可协商", "硬性要求"]
    reason: 弹性确认的核对式措辞；正确问法是"松不松得动"（act2）

  - id: assessment_words
    type: hard
    mode: substring
    patterns: ["评估", "测试", "量表", "题目", "性格分析"]
    reason: 测评词汇，破坏 act3 情境题的闲聊感

  - id: mechanical_transition
    type: hard
    mode: substring
    mode_note: 句首裸「好的」用正则锚定开头，避免句中正常用法误报
    patterns: ["好的，那接下来", "好的,那接下来", "下一个问题", "接下来我们"]
    regex_patterns: ['^\s*好的?[，,。！！]', '^\s*好[，,]']
    reason: act2 机械过渡句，表单感的主要来源

  - id: markdown
    type: hard
    mode: regex
    patterns:
      - '(?m)^\s*[-*+]\s'        # 行首列表符（锚定行首，避免中文破折号误报）
      - '(?m)^\s*\d+[.、)]\s'    # 行首编号
      - '\*\*'                    # 粗体
      - '(?m)^\s*#{1,6}\s'       # 标题
    reason: 聊天中禁止列表与富文本

  # ---- HLD V1/V2/V3：三条结构性规则（非词表，由代码按 mode 判定）----
  - id: missing_question
    type: hard
    mode: must_ask
    reason: 无收尾指令时回复必须含提问（V1）——实测出现连续两轮不问问题，漏斗就此停住

  - id: repeated_opening
    type: hard
    mode: no_repeat_opening
    opening_chars: 8
    reason: 开头与上一轮小缘回复相同 = 复读（V2）

  - id: closing_phrases
    type: hard
    mode: substring
    patterns: ["今天聊到这里", "今天先聊到这", "随时欢迎再来", "期待下次", "我们下次再聊",
               "祝你有个愉快"]
    reason: 无收尾指令却说结束语 = 自作主张收尾（V3）

  - id: progress_language
    type: review
    mode: substring
    patterns: ["完成度", "进度", "百分之", "%"]
    reason: 表单语言；用户自行询问进度时编排器要求如实作答，故此组在 progress 场景豁免

  - id: outcome_promise
    type: review
    mode: substring
    patterns: ["一定能", "保证", "肯定帮你", "一定帮你"]
    reason: 结果承诺红线；非结果语境（如"一定要注意安全"）需人工判定

  - id: length
    type: review
    mode: length
    reason: 长度即腔调；超限多为说教或分点作答
